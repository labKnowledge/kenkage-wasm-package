<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kenkage Network Bridge</title>
<style>
  :root { color-scheme: dark; }
  body {
    width: 320px;
    margin: 0;
    padding: 16px;
    background: #0e0f13;
    color: #e2e4ed;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1 img { width: 20px; height: 20px; }
  .sub { color: #8b8fa5; margin: 0 0 14px; font-size: 12px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: #16171d;
    border: 1px solid #2a2b35;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .row span:first-child { color: #c7cade; }
  .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #2a2b35; border-radius: 20px; transition: .15s;
  }
  .slider::before {
    content: ""; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px;
    background: #8b8fa5; border-radius: 50%; transition: .15s;
  }
  input:checked + .slider { background: #7c8aff33; }
  input:checked + .slider::before { transform: translateX(14px); background: #7c8aff; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: #555872; margin: 16px 0 8px;
  }
  #activity { max-height: 180px; overflow-y: auto; }
  .entry {
    padding: 6px 0; border-bottom: 1px solid #1c1d25;
    font-size: 12px; display: flex; flex-direction: column; gap: 2px;
  }
  .entry .url { color: #c7cade; word-break: break-all; }
  .entry .meta { color: #555872; font-size: 11px; }
  .ok { color: #4ade80; }
  .fail { color: #f87171; }
  .empty { color: #555872; font-style: italic; padding: 8px 0; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> Kenkage Network Bridge</h1>
  <p class="sub">Relays fetch() requests from pages using kenkage — real network, on this machine, nothing sent to any server of ours.</p>

  <div class="row">
    <span>Bridge enabled</span>
    <label class="switch">
      <input type="checkbox" id="enabledToggle">
      <span class="slider"></span>
    </label>
  </div>

  <h2>Recent activity</h2>
  <div id="activity"><div class="empty">No requests yet.</div></div>

  <script src="popup.js"></script>
</body>
</html>
